<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  <g filter="url(#shadow)" transform="translate(96, 96)">
    <!-- Photo Frame -->
    <rect x="20" y="20" width="280" height="280" rx="24" fill="#ffffff" stroke="#93c5fd" stroke-width="8"/>
    <!-- Passport Silhouette -->
    <circle cx="160" cy="110" r="45" fill="#3b82f6"/>
    <path d="M 85 220 C 85 170, 235 170, 235 220 Z" fill="#3b82f6"/>
    <!-- Stamp Ribbon -->
    <rect x="40" y="235" width="240" height="45" rx="8" fill="#eff6ff"/>
    <rect x="70" y="248" width="180" height="8" rx="4" fill="#60a5fa"/>
    <rect x="90" y="262" width="140" height="6" rx="3" fill="#93c5fd"/>
    <!-- Verification Checkmark Badge -->
    <circle cx="280" cy="280" r="42" fill="#10b981" stroke="#ffffff" stroke-width="6"/>
    <path d="M 265 280 L 275 290 L 298 268" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
