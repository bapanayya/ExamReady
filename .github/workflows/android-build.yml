name: Build Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Sync Capacitor Android
        run: |
          npx cap sync android
          npm run sync:android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew 2>/dev/null || true
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExamReady-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare Named Release APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ExamReady.apk

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: v1.0.0
          name: "ExamReady Android App v1.0.0 (Official Release)"
          body: |
            ### 📱 ExamReady Official Android Application
            - **Official Logo**: Embedded with "The Competitive Edge" golden shield logo
            - **37+ Competitive Exams**: SSC, UPSC, IBPS, NTA (NEET/JEE/CUET), IITs (GATE/JAM), State PSCs (APPSC)
            - **Features**: Auto-Crop & Fit, Intelligent KB Optimizer, Certificate to PDF, 100% Free & Offline
            - **Direct Download**: Tap `ExamReady.apk` below to download and install directly on your Android smartphone!
          files: |
            ExamReady.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
