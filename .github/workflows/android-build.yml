name: Build Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - name: Accept Android SDK Licenses and Install Platform 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Sync Capacitor Android
        run: |
          npx cap sync android
          npm run sync:android

      - name: Build Android APK and App Bundle (AAB for Google Play Store)
        run: |
          cd android
          chmod +x gradlew 2>/dev/null || true
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace
            ./gradlew bundleRelease --stacktrace || true
          else
            gradle assembleDebug --stacktrace
            gradle bundleRelease --stacktrace || true
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExamReady-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Play Store AAB Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExamReady-PlayStore-AAB
          path: android/app/build/outputs/bundle/release/*.aab

      - name: Prepare Named Release Assets
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ExamReady.apk
          if ls android/app/build/outputs/bundle/release/*.aab 1> /dev/null 2>&1; then
            cp android/app/build/outputs/bundle/release/*.aab ExamReady.aab
          fi

      - name: Create or Update GitHub Release with APK and AAB
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: v1.0.4
          name: "ExamReady Android App v1.0.4 (Official Release)"
          body: |
            ### 📱 ExamReady Official Android Application (v1.0.4)
            - **Fixed Base64 Encoding**: Clean native Downloads and Sharing to WhatsApp, Telegram, Gmail, and Drive.
            - **Optimized Camera Capture**: Automatically downsamples and orients captured photos, placing them smoothly into the frame.
            - **Fluid Typing & Search**: Instant keyboard responsiveness without typing lag or interruption.
            - **Clean UI**: Removed redundant install tab for streamlined user experience.
            - **Official Logo**: Embedded with "The Competitive Edge" golden shield logo
            - **37+ Competitive Exams**: SSC, UPSC, IBPS, NTA (NEET/JEE/CUET), IITs (GATE/JAM), State PSCs (APPSC)
            - **Features**: Auto-Crop & Fit, Intelligent KB Optimizer, Certificate to PDF, 100% Free & Offline
            - **Direct Download**:
              - Tap `ExamReady.apk` to install directly on your Android phone.
              - `ExamReady.aab` is the official Google Play Store Android App Bundle (signed with production upload keystore).
          files: |
            ExamReady.apk
            ExamReady.aab
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
